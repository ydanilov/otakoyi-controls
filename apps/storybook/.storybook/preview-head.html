<!--
  Test hook: counts React commits in the preview (stories read window.__oscCommits, e.g. Pult ›
  Connected Control › High-rate feedback). Only installed when React DevTools is not present.
-->
<script>
  if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
    window.__oscCommits = 0;
    window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
      isDisabled: false,
      supportsFiber: true,
      renderers: new Map(),
      inject: function (renderer) {
        var id = this.renderers.size + 1;
        this.renderers.set(id, renderer);
        return id;
      },
      // React DOM commits only (Skia's canvases run their own reconciler).
      onCommitFiberRoot: function (id) {
        var r = this.renderers.get(id);
        if (r && r.rendererPackageName === "react-dom") window.__oscCommits++;
      },
      onCommitFiberUnmount: function () {},
      onPostCommitFiberRoot: function () {},
      checkDCE: function () {},
    };
  }
</script>
